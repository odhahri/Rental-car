{% extends 'cars/shared/base_template.html' %}
{% block title %}List of cars{% endblock %}

{% block styles %}
{% endblock %}

{% block content %}
<h1>List of Cars</h1>
<ul class="list-group">
    {% for car in cars %}
    <li class="list-group-item">
        <a href="{% url 'car_detail_page' car.car_id %}">{{ car.name }}</a> - {{ car.model }}
    </li>
    {% endfor %}
</ul>
{% endblock %}
