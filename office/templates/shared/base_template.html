<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    {% block head %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
        Default Title
        {% endblock %}
    </title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pako/dist/pako.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
    <!-- Include Select2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <!-- Include Select2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- the js file should be placed in the template itself because it depends on generic variables -->
    <!-- <script src="{% static 'scripts/office/generic_script.js' %}" type="text/javascript" defer></script> -->

    {% block styles %}
    <link rel="stylesheet" href="{% static 'stylesheets/office/generic_table_style.css' %}">

    <!-- Additional Stylesheets -->
    {% endblock %}
    {% endblock %}
</head>



<body>
    <!-- Mobile Toggle Button -->
    <button class="sidebar-toggle d-md-none" onclick="toggleSidebar()">
        <i class="bi bi-list"></i>
    </button>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a class="sidebar-brand">EasyRent Back Office</a>
        </div>
        <div class="sidebar-nav">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a href="{% url 'office_default_page' %}"
                        class="nav-link {% if request.path == '/' %}active{% endif %}">
                        <i class="bi bi-house-door"></i>
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'office_cars_page' %}"
                        class="nav-link {% if '/cars' in request.path %}active{% endif %}">
                        <i class="bi bi-car-front"></i>
                        Cars
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'office_agents_page' %}"
                        class="nav-link {% if '/agents' in request.path %}active{% endif %}">
                        <i class="bi bi-people"></i>
                        Agents
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'office_reservations_page' %}"
                        class="nav-link {% if '/reservations' in request.path %}active{% endif %}">
                        <i class="bi bi-calendar-check"></i>
                        Reservations
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'office_clients_page' %}"
                        class="nav-link {% if '/clients' in request.path %}active{% endif %}">
                        <i class="bi bi-person-circle"></i>
                        Clients
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        {% block content %}

        {% endblock %}
    </div>

    <!-- Required Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('show');
        }

        // Close sidebar when clicking outside on mobile
        document.addEventListener('click', function (event) {
            const sidebar = document.getElementById('sidebar');
            const sidebarToggle = document.querySelector('.sidebar-toggle');

            if (window.innerWidth <= 768 &&
                !sidebar.contains(event.target) &&
                !sidebarToggle.contains(event.target)) {
                sidebar.classList.remove('show');
            }
        });
    </script>
</body>

</html>
