<!DOCTYPE html>
<html lang="en">

<head>
    {% block head %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
        Default Title
        {% endblock %}
    </title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pako/dist/pako.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>

    {% block styles %}
    <!-- Additional Stylesheets -->
    {% endblock %}
    {% endblock %}
</head>

<style>
    /* Inherit Variables from Main Style */
    :root {
        --primary-color: #2563eb;
        --primary-hover: #1d4ed8;
        --background-color: #f8fafc;
        --card-background: #ffffff;
        --text-primary: #1e293b;
        --text-secondary: #64748b;
        --success-color: #10b981;
        --danger-color: #ef4444;
        --border-radius: 1rem;
        --transition: all 0.3s ease;
        --sidebar-width: 280px;
    }

    body {
        background-color: var(--background-color);
        min-height: 100vh;
    }

    /* Sidebar Styling */
    .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: var(--sidebar-width);
        background: var(--card-background);
        box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        z-index: 1000;
        transition: var(--transition);
    }

    .sidebar-header {
        padding: 1.5rem;
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .sidebar-brand {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-primary);
        text-decoration: none;
    }

    .sidebar-nav {
        padding: 1rem 0;
    }

    .nav-item {
        padding: 0.25rem 1.5rem;
    }

    .nav-link {
        display: flex;
        align-items: center;
        padding: 0.75rem 1rem;
        color: var(--text-secondary);
        text-decoration: none;
        border-radius: 0.5rem;
        transition: var(--transition);
    }

    .nav-link:hover {
        background-color: rgba(37, 99, 235, 0.1);
        color: var(--primary-color);
    }

    .nav-link.active {
        background-color: var(--primary-color);
        color: white;
    }

    .nav-link i {
        margin-right: 0.75rem;
        font-size: 1.25rem;
    }

    /* Main Content Area */
    .main-content {
        margin-left: var(--sidebar-width);
        padding: 2rem;
        min-height: 100vh;
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
        .sidebar {
            transform: translateX(-100%);
        }

        .sidebar.show {
            transform: translateX(0);
        }

        .main-content {
            margin-left: 0;
        }

        .sidebar-toggle {
            display: block;
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 1001;
            background: var(--card-background);
            border: none;
            padding: 0.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
    }
</style>

<body>
    <!-- Mobile Toggle Button -->
    <button class="sidebar-toggle d-md-none" onclick="toggleSidebar()">
        <i class="bi bi-list"></i>
    </button>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a class="sidebar-brand">EasyRent Back Office</a>
        </div>
        <div class="sidebar-nav">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a href="{% url 'office_default_page' %}"
                        class="nav-link {% if request.path == '/' %}active{% endif %}">
                        <i class="bi bi-house-door"></i>
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'office_cars_page' %}"
                        class="nav-link {% if '/cars' in request.path %}active{% endif %}">
                        <i class="bi bi-car-front"></i>
                        Cars
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'office_agents_page' %}"
                        class="nav-link {% if '/agents' in request.path %}active{% endif %}">
                        <i class="bi bi-people"></i>
                        Agents
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'office_reservations_page' %}"
                        class="nav-link {% if '/reservations' in request.path %}active{% endif %}">
                        <i class="bi bi-calendar-check"></i>
                        Reservations
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'office_clients_page' %}"
                        class="nav-link {% if '/clients' in request.path %}active{% endif %}">
                        <i class="bi bi-person-circle"></i>
                        Clients
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        {% block content %}

        {% endblock %}
    </div>

    <!-- Required Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('show');
        }

        // Close sidebar when clicking outside on mobile
        document.addEventListener('click', function (event) {
            const sidebar = document.getElementById('sidebar');
            const sidebarToggle = document.querySelector('.sidebar-toggle');

            if (window.innerWidth <= 768 &&
                !sidebar.contains(event.target) &&
                !sidebarToggle.contains(event.target)) {
                sidebar.classList.remove('show');
            }
        });
    </script>
</body>

</html>
