
{% extends 'identification/shared/base_template.html' %}

{% block title %}User Identification{% endblock %}

{% block styles %}
<style>
    /* Modern Design Variables */
    :root {
        --primary-gradient: linear-gradient(135deg, #2563eb, #1e40af);
        --background-blur: rgba(255, 255, 255, 0.1);
        --border-glass: rgba(255, 255, 255, 0.2);
        --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.1);
        --transition: all 0.4s ease-in-out;
    }

    body {
        background: radial-gradient(circle at top, #f0f4f8, #dce3eb);
    }

    .page-title {
        font-size: 2.5rem;
        font-weight: 700;
        color: #1e293b;
        text-align: center;
        margin-bottom: 2rem;
        position: relative;
    }

    .page-title::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 4px;
        background: var(--primary-gradient);
        border-radius: 2px;
    }

    /* Glassmorphism Cards */
    .role-card .card {
        background: var(--background-blur);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border-glass);
        border-radius: 1.5rem;
        box-shadow: var(--shadow-soft);
        overflow: hidden;
        transition: var(--transition);
    }

    .role-card .card:hover {
        transform: translateY(-10px) scale(1.02);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
    }

    .role-card img {
        height: 220px;
        object-fit: cover;
        width: 100%;
        border-top-left-radius: 1.5rem;
        border-top-right-radius: 1.5rem;
    }

    .role-card .card-body {
        padding: 2rem;
        text-align: center;
    }

    .role-card .card-title {
        font-size: 1.5rem;
        font-weight: 600;
        color: #1e293b;
    }

    .role-card .card-text {
        color: #64748b;
        font-size: 1rem;
        margin-bottom: 1.5rem;
    }

    /* Gradient Buttons */
    .btn-primary {
        background: var(--primary-gradient);
        color: white;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        border-radius: 2rem;
        border: none;
        transition: var(--transition);
    }

    .btn-primary:hover {
        filter: brightness(1.1);
        transform: translateY(-3px);
    }
</style>
{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="page-title">Identify Yourself</h1>
    <div class="row g-4 justify-content-center pt-5 pb-5">
        <div class="col-md-4 role-card">
            <div class="card">

                <img src="https://www.interactivebrokers.com/images/web/hero-microsite-fund-admin.jpg" alt="Admin" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">Admin</h5>
                 
                </div>
            </div>
        </div>
        <div class="col-md-4 role-card">
            <div class="card">
                <img src="https://www.advancia-teleservices.com/wp-content/uploads/2023/10/agent-centre-appel.jpg" alt="Admin" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">Agent</h5>
                    
                </div>
            </div>
        </div>
        
        <a href="" class="col-md-4 role-card">
            <div class="card">
                <img src="https://skeepers.io/app/uploads/2022/10/choses-que-vous-devez-connaitre-sur-vos-clients-scaled-1.jpeg" alt="Guest" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">Client</h5>
    
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
